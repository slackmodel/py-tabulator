[project]
name = "pytabulator"
version = "0.2.5+slackmodel.1"
description = "Shiny bindings for Tabulator JS"
authors = [{ name = "Stefan Kuethe", email = "stefan.kuethe@eoda.de" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.9,<4.0"
dependencies = [
    "shiny>=0.7.0",
    "pandas",
]

[project.optional-dependencies]
all = ["pydantic>=2.6.1,<3"]
pydantic = ["pydantic>=2.6.1,<3"]

[dependency-groups]
dev = [
    "black>=24.1.1,<25",
    "isort>=5.13.2,<6",
    "pytest>=8.0.0,<9",
    "mkdocs>=1.5.3,<2",
    "mkdocs-material>=9.5.6,<10",
    "mkdocstrings[python]>=0.24.0,<0.25",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "pytabulator"
source-exclude = ["srcjs/*.sh"]
wheel-exclude = ["srcjs/*.sh"]
